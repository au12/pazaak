<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="{{BASE}}" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1922" />
    <meta name="description" content="Pazaak, the cantina card game, for two players in the browser." />
    <title>{{SITE_NAME}}</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" href="fonts/michroma.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/chakra-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <script id="config" type="application/json">{{CONFIG}}</script>
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="lamp" aria-hidden="true"></div>

    <!-- ───────────── Home ───────────── -->
    <main id="home" class="screen" hidden>
      <section class="hero">
        <div class="logo" id="logo">
          <div class="logo-fan" id="logo-fan"></div>
          <svg class="wordmark" viewBox="0 0 760 150" role="img" aria-label="Pazaak">
            <defs>
              <linearGradient id="wm-metal" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFFFFF" />
                <stop offset=".38" stop-color="#D6DDE3" />
                <stop offset=".5" stop-color="#7D8995" />
                <stop offset=".56" stop-color="#9AA6B1" />
                <stop offset=".8" stop-color="#E4E9ED" />
                <stop offset="1" stop-color="#A3AEB8" />
              </linearGradient>
              <linearGradient id="wm-sheen" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity="0" />
                <stop offset=".5" stop-color="#fff" stop-opacity=".85" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </linearGradient>
              <clipPath id="wm-clip"><text x="380" y="96" text-anchor="middle" class="wm-text">PAZAAK</text></clipPath>
              <filter id="wm-glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9" /></filter>
            </defs>
            <text x="380" y="100" text-anchor="middle" class="wm-text wm-halo" fill="#F3A73B" filter="url(#wm-glow)">PAZAAK</text>
            <text x="380" y="99" text-anchor="middle" class="wm-text" fill="#05090C">PAZAAK</text>
            <text x="380" y="96" text-anchor="middle" class="wm-text" fill="url(#wm-metal)" stroke="#1A232B" stroke-width="1.5" paint-order="stroke">PAZAAK</text>
            <g clip-path="url(#wm-clip)"><rect class="wm-sheen" x="-200" y="0" width="160" height="150" fill="url(#wm-sheen)" /></g>
            <g class="wm-rule">
              <rect x="130" y="124" width="215" height="3" rx="1.5" fill="#F3A73B" />
              <rect x="415" y="124" width="215" height="3" rx="1.5" fill="#F3A73B" />
              <text x="380" y="134" text-anchor="middle" class="wm-20">20</text>
            </g>
          </svg>
        </div>
        <p class="tagline">The cantina card game. Finish a set closer to 20 than your opponent, and never go over.</p>
      </section>

      <section class="home-panel">
        <label class="field">
          <span>Your name</span>
          <input id="home-name" maxlength="18" autocomplete="nickname" placeholder="What the table calls you" />
        </label>

        <div class="home-block">
          <h2>Play the computer</h2>
          <div class="rivals" id="rivals">
            <button class="rival" data-level="easy">
              <span class="rival-face" data-level="easy"></span>
              <span class="rival-name">Tobb</span>
              <span class="rival-note">Easy. Stands early and forgets his hand.</span>
            </button>
            <button class="rival" data-level="normal">
              <span class="rival-face" data-level="normal"></span>
              <span class="rival-name">Vessa</span>
              <span class="rival-note">Steady. Saves herself and chases a stand.</span>
            </button>
            <button class="rival" data-level="hard">
              <span class="rival-face" data-level="hard"></span>
              <span class="rival-name">Oru-Kaan</span>
              <span class="rival-note">Sharp. Counts the deck before every draw.</span>
            </button>
          </div>
        </div>

        <div class="home-block">
          <h2>Play a friend</h2>
          <div class="home-row">
            <button class="btn btn-amber" id="create-room">Open a table</button>
            <form class="join" id="join-form">
              <input id="join-code" placeholder="Table code or link" autocomplete="off" spellcheck="false" />
              <button class="btn" type="submit">Join</button>
            </form>
          </div>
          <input id="create-password" class="password" type="password" placeholder="Server password" hidden />
        </div>

        <p class="home-foot"><button class="link" data-open="guide">How to play</button> <span aria-hidden="true">/</span> <button class="link" data-open="settings">Sound and settings</button></p>
      </section>
    </main>

    <!-- ───────────── In a room ───────────── -->
    <div id="room" class="screen" hidden>
      <header class="topbar">
        <button class="icon-btn" id="leave-room" title="Back to the start" aria-label="Back to the start">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button class="room-code" id="room-code" title="Copy the invite link"><span id="room-code-text"></span><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2" /><path d="M5 15V6a1 1 0 011-1h9" /></svg></button>
        <span class="topbar-mid" id="topbar-mid"></span>
        <span class="conn" id="conn" hidden>Reconnecting…</span>
        <div class="topbar-tools">
          <button class="icon-btn" id="chat-toggle" title="Chat" aria-label="Chat">
            <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" /></svg><i class="dot" id="chat-dot" hidden></i>
          </button>
          <button class="icon-btn" id="music-toggle" title="Music" aria-label="Music">
            <svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="17.5" cy="16" r="2.5" /></svg>
          </button>
          <button class="icon-btn" data-open="guide" title="How to play" aria-label="How to play">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2M12 17h.01" /></svg>
          </button>
          <button class="icon-btn" id="menu-toggle" title="More" aria-label="More">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="19" cy="12" r="1.4" /></svg>
          </button>
        </div>
        <div class="menu" id="menu" hidden>
          <button data-open="settings">Sound and settings</button>
          <button id="menu-lobby">Table and seats</button>
          <button id="menu-forfeit" class="danger">Forfeit the match</button>
        </div>
      </header>

      <!-- The lobby: seats, settings, the room's record -->
      <section id="lobby" class="view" hidden></section>
      <!-- Choosing a side deck -->
      <section id="draft" class="view" hidden></section>
      <!-- The table -->
      <section id="table" class="view" hidden></section>

      <aside class="chat" id="chat" hidden>
        <div class="chat-head"><strong>Table talk</strong><button class="icon-btn" id="chat-close" aria-label="Close chat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button></div>
        <div class="emotes" id="emotes"></div>
        <ol class="chat-log" id="chat-log"></ol>
        <form class="chat-form" id="chat-form"><input id="chat-input" maxlength="200" placeholder="Say something" autocomplete="off" /><button class="btn">Send</button></form>
      </aside>
    </div>

    <!-- ───────────── Overlays ───────────── -->
    <div class="modal" id="guide" hidden role="dialog" aria-modal="true" aria-labelledby="guide-title">
      <div class="modal-box guide">
        <header class="modal-head">
          <h2 id="guide-title">How to play</h2>
          <div class="tabs" role="tablist" id="guide-tabs">
            <button role="tab" data-tab="rules" aria-selected="true">Rules</button>
            <button role="tab" data-tab="cards">Side cards</button>
            <button role="tab" data-tab="watch">Watch a match</button>
          </div>
          <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
        </header>
        <div class="modal-body" id="guide-body"></div>
      </div>
    </div>

    <div class="modal" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-box narrow">
        <header class="modal-head">
          <h2 id="settings-title">Sound and settings</h2>
          <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
        </header>
        <div class="modal-body settings">
          <label class="slider"><span>Cantina music</span><input type="range" id="vol-music" min="0" max="100" /></label>
          <label class="slider"><span>Sound effects</span><input type="range" id="vol-sfx" min="0" max="100" /></label>
          <label class="check"><input type="checkbox" id="pref-motion" /><span>Calmer animations</span></label>
          <label class="field" id="rename-field"><span>Your name</span><input id="settings-name" maxlength="18" /></label>
          <p class="now-playing" id="now-playing"></p>
        </div>
      </div>
    </div>

    <div class="toast-stack" id="toasts" aria-live="polite"></div>
    <canvas id="fx" aria-hidden="true"></canvas>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
